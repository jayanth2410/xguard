{% extends "base.html" %}

{% block title %}Validation Session - Maker-Checker Platform{% endblock %}

{% block content %}
<div x-data="validationSession('{{ work_package_id }}')" x-init="loadSession()">
    <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-900">Execution Validation</h1>
        <p class="text-gray-600 mt-2">Answer the validation questions before execution can proceed</p>
    </div>

    <!-- Loading State -->
    <div x-show="loading" class="text-center py-12">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mx-auto"></div>
        <p class="mt-4 text-gray-600">Loading validation session...</p>
    </div>

    <!-- Session Info -->
    <div x-show="!loading && session" x-cloak class="bg-white rounded-lg shadow mb-6 p-6">
        <div class="flex items-center justify-between">
            <div>
                <h2 class="text-xl font-semibold" x-text="workPackage.title"></h2>
                <p class="text-gray-600" x-text="'Ticket: ' + workPackage.ticket_id"></p>
            </div>
            <div class="text-right">
                <span class="px-3 py-1 rounded-full text-sm"
                      :class="session.all_questions_answered ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'">
                    <span x-text="session.answered_questions"></span> / <span x-text="session.total_questions"></span> answered
                </span>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="mt-4 w-full bg-gray-200 rounded-full h-2">
            <div class="bg-indigo-600 h-2 rounded-full transition-all duration-300"
                 :style="'width: ' + (session.total_questions ? (session.answered_questions / session.total_questions * 100) : 0) + '%'"></div>
        </div>
    </div>

    <!-- Questions by Category -->
    <div x-show="!loading && questions.length > 0" x-cloak>
        <template x-for="(categoryQuestions, category) in groupedQuestions" :key="category">
            <div class="bg-white rounded-lg shadow mb-6">
                <div class="px-6 py-4 border-b border-gray-200">
                    <h3 class="text-lg font-semibold capitalize" x-text="getCategoryTitle(category)"></h3>
                </div>
                <div class="p-6 space-y-6">
                    <template x-for="question in categoryQuestions" :key="question.id">
                        <div class="border-b border-gray-100 pb-6 last:border-0 last:pb-0">
                            <label class="block text-sm font-medium text-gray-900 mb-2">
                                <span x-text="question.question_text"></span>
                                <span x-show="question.is_required" class="text-red-500">*</span>
                            </label>

                            <!-- Text Input -->
                            <template x-if="question.question_type === 'text'">
                                <input type="text"
                                       :value="getResponse(question.id)"
                                       @input="updateResponse(question.id, $event.target.value)"
                                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500"
                                       :placeholder="question.placeholder || 'Enter your response'">
                            </template>

                            <!-- Select Input -->
                            <template x-if="question.question_type === 'select'">
                                <select :value="getResponse(question.id)"
                                        @change="updateResponse(question.id, $event.target.value)"
                                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500">
                                    <option value="">Select an option</option>
                                    <template x-for="option in question.options" :key="option">
                                        <option :value="option" x-text="option"></option>
                                    </template>
                                </select>
                            </template>

                            <!-- Response Status -->
                            <div x-show="getResponse(question.id)" class="mt-2 flex items-center text-green-600 text-sm">
                                <svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20">
                                    <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
                                </svg>
                                Answered
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </div>

    <!-- Actions -->
    <div x-show="!loading && session" x-cloak class="bg-white rounded-lg shadow p-6">
        <div class="flex items-center justify-between">
            <div>
                <template x-if="!session.all_questions_answered">
                    <p class="text-yellow-600">
                        <span x-text="session.unanswered_required"></span> required questions remaining
                    </p>
                </template>
                <template x-if="session.all_questions_answered">
                    <p class="text-green-600 font-medium">All required questions answered! Ready to proceed.</p>
                </template>
            </div>
            <div class="flex space-x-4">
                <button @click="saveResponses"
                        class="px-4 py-2 bg-gray-100 text-gray-700 rounded-md hover:bg-gray-200"
                        :disabled="saving">
                    <span x-show="!saving">Save Progress</span>
                    <span x-show="saving">Saving...</span>
                </button>
                <button @click="proceedToExecution"
                        class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 disabled:opacity-50"
                        :disabled="!session.all_questions_answered || saving">
                    Proceed to Execution
                </button>
            </div>
        </div>
    </div>

    <!-- Message -->
    <div x-show="message" x-cloak
         :class="messageType === 'success' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'"
         class="mt-4 p-4 rounded-md">
        <span x-text="message"></span>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function validationSession(workPackageId) {
    return {
        workPackageId: workPackageId,
        workPackage: {},
        session: null,
        questions: [],
        responses: {},
        loading: true,
        saving: false,
        message: '',
        messageType: '',

        get groupedQuestions() {
            const groups = {};
            this.questions.forEach(q => {
                const cat = q.category || 'other';
                if (!groups[cat]) groups[cat] = [];
                groups[cat].push(q);
            });
            return groups;
        },

        async loadSession() {
            try {
                // Load work package
                const wpRes = await fetch(`/api/v1/work-packages/${this.workPackageId}`);
                if (wpRes.ok) {
                    this.workPackage = await wpRes.json();
                } else {
                    this.message = 'Work package not found';
                    this.messageType = 'error';
                    this.loading = false;
                    return;
                }

                // Try to get existing session for this work package
                let sessionRes = await fetch(`/api/v1/validation/work-package/${this.workPackageId}/session`);

                if (!sessionRes.ok) {
                    // No existing session - create new one if work package is approved
                    if (this.workPackage.status === 'approved') {
                        sessionRes = await fetch('/api/v1/validation/session', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ work_package_id: this.workPackageId })
                        });
                    } else {
                        this.message = `Cannot start validation. Work package status is: ${this.workPackage.status}. Must be 'approved'.`;
                        this.messageType = 'error';
                        this.loading = false;
                        return;
                    }
                }

                if (sessionRes.ok) {
                    const data = await sessionRes.json();
                    this.session = data.session_details || data;

                    // Load questions
                    const questionsRes = await fetch(`/api/v1/validation/session/${this.session.session_id}/questions`);
                    if (questionsRes.ok) {
                        const qData = await questionsRes.json();
                        this.questions = qData.questions || [];
                    }
                } else {
                    const error = await sessionRes.json();
                    this.message = error.detail || 'Failed to load/create validation session';
                    this.messageType = 'error';
                }
            } catch (error) {
                this.message = 'Failed to load validation session: ' + error.message;
                this.messageType = 'error';
            }

            this.loading = false;
        },

        getResponse(questionId) {
            return this.responses[questionId] || '';
        },

        updateResponse(questionId, value) {
            this.responses[questionId] = value;
        },

        async saveResponses() {
            this.saving = true;

            const responsesToSubmit = Object.entries(this.responses)
                .filter(([_, value]) => value)
                .map(([questionId, value]) => ({
                    question_id: questionId,
                    response_text: value
                }));

            if (responsesToSubmit.length === 0) {
                this.message = 'No responses to save';
                this.messageType = 'error';
                this.saving = false;
                return;
            }

            try {
                const response = await fetch(`/api/v1/validation/session/${this.session.session_id}/respond-multiple`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(responsesToSubmit)
                });

                if (response.ok) {
                    const data = await response.json();
                    this.session = data.session_status;
                    this.message = 'Responses saved successfully!';
                    this.messageType = 'success';
                } else {
                    const error = await response.json();
                    this.message = error.detail || 'Failed to save responses';
                    this.messageType = 'error';
                }
            } catch (error) {
                this.message = 'Network error. Please try again.';
                this.messageType = 'error';
            }

            this.saving = false;
        },

        async proceedToExecution() {
            await this.saveResponses();

            if (this.session.all_questions_answered) {
                window.location.href = `/workflow/execute/${this.workPackageId}`;
            }
        },

        getCategoryTitle(category) {
            const titles = {
                'network': 'Network Change Questions',
                'server': 'Server Change Questions',
                'database': 'Database Change Questions',
                'cloud': 'Cloud/Security Questions',
                'application': 'Application Change Questions',
                'security': 'Security Change Questions',
                'container': 'Container/K8s Questions',
                'monitoring': 'Monitoring Change Questions',
                'common': 'Common Validation Questions'
            };
            return titles[category] || category + ' Questions';
        }
    }
}
</script>
{% endblock %}
