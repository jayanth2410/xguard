<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - XGuard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center p-4">
    <main class="w-full max-w-sm overflow-hidden rounded-lg border border-blue-200 bg-white shadow-lg">
        <div class="border-b border-blue-100 bg-blue-50 px-6 py-5 text-center">
            <img src="{{ url_for('static', filename='images/xguard-logo.png') }}" alt="XGuard" class="mx-auto h-14 w-auto object-contain">
            <p class="mt-2 text-sm text-slate-600">Enterprise Change Control</p>
        </div>
        <form method="post" class="space-y-4 p-6">
            <div>
                <h1 class="text-xl font-semibold text-slate-900">Sign in</h1>
                <p class="mt-1 text-sm text-slate-500">Use your XGuard username or email.</p>
            </div>
            {% if error %}
            <div class="rounded border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">{{ error }}</div>
            {% endif %}
            <div>
                <label for="username" class="mb-1 block text-sm font-medium text-slate-700">Username or email</label>
                <input id="username" name="username" value="{{ username or '' }}" required autofocus autocomplete="username"
                       class="w-full rounded border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100">
            </div>
            <div>
                <label for="password" class="mb-1 block text-sm font-medium text-slate-700">Password</label>
                <input id="password" name="password" type="password" required autocomplete="current-password"
                       class="w-full rounded border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100">
            </div>
            <button type="submit" class="w-full rounded bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700">Sign in</button>
        </form>
    </main>
</body>
</html>
