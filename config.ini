[application]
APP_NAME=Maker-Checker Platform
APP_VERSION=1.0.0
DEBUG=true
SECRET_KEY=your-secret-key-change-in-production

[database]
DATABASE_URL=sqlite:///./makerchecker.db
# For PostgreSQL use: postgresql://user:password@localhost:5432/makerchecker

[api]
API_PREFIX=/api/v1
CORS_ORIGINS=http://localhost:5000,http://127.0.0.1:5000

[flask]
FLASK_SECRET_KEY=flask-secret-key-change-in-production
FLASK_DEBUG=true
FLASK_HOST=0.0.0.0
FLASK_PORT=5000

[fastapi]
FASTAPI_HOST=127.0.0.1
FASTAPI_PORT=8000

[servicenow]
SERVICENOW_INSTANCE=https://dev187880.service-now.com
SERVICENOW_USERNAME=admin
SERVICENOW_PASSWORD=wEA$up08pX=S
# Tables: incident, change_request, sc_request
SERVICENOW_INCIDENT_TABLE=incident
SERVICENOW_CHANGE_TABLE=change_request
SERVICENOW_REQUEST_TABLE=sc_request
SERVICENOW_APPROVAL_FIELD=u_owner_approval
SERVICENOW_ASSIGNMENT_GROUP=
SERVICENOW_ENABLED=true

[execution]
# Remote script storage path
SCRIPT_STORAGE_PATH=/tmp/makerchecker/scripts
SCRIPT_STORAGE_PATH_WINDOWS=C:\Temp\makerchecker\scripts
# Default timeout for script execution (seconds)
EXECUTION_TIMEOUT=600
# Enable dry run by default
DRY_RUN_DEFAULT=false

[ssh]
DEFAULT_SSH_PORT=22
SSH_TIMEOUT=30
SSH_KEY_PATH=

[winrm]
DEFAULT_WINRM_PORT=5985
WINRM_TRANSPORT=ntlm
WINRM_TIMEOUT=30

[logging]
LOG_LEVEL=INFO
LOG_FORMAT=json
LOG_FILE=logs/makerchecker.log

[security]
# JWT settings
JWT_SECRET_KEY=jwt-secret-key-change-in-production
JWT_ALGORITHM=HS256
JWT_EXPIRATION_HOURS=24
